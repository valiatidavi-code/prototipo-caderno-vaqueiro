<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B4441E">
<meta name="description" content="Caderno de campo das Fazendas Chapadão e Serro Azul: anota nascimentos, pesagens, pasto e doenças e calcula os índices.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno">
<title>Caderno do Vaqueiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: caderno de campo de bolso — uma coluna, botões grandes pro polegar, barra de abas fixa embaixo */
:root{
  --bg:#F3EEE6; --surface:#FFFDF9; --ink:#2A2118; --muted:#76695B; --line:#DDD2C3;
  --accent:#B4441E; --accent-ink:#FFFFFF; --pasto:#3F6B2E; --ok:#2F7A3B; --warn:#B7791F; --bad:#B42318;
  --chip:#EDE4D7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1712; --surface:#25201A; --ink:#F1E9DD; --muted:#B3A593; --line:#3B342B;
  --accent:#E06A3E; --accent-ink:#1B1712; --pasto:#8DB874; --ok:#6CC27B; --warn:#E3A84A; --bad:#F07467; --chip:#322B23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1712; --surface:#25201A; --ink:#F1E9DD; --muted:#B3A593; --line:#3B342B;
  --accent:#E06A3E; --accent-ink:#1B1712; --pasto:#8DB874; --ok:#6CC27B; --warn:#E3A84A; --bad:#F07467; --chip:#322B23; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{padding-block:18px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:13px;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.demo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-block:6px 14px}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.wide{grid-column:1/-1}
.bar{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--pasto)}
.state{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.s-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.s-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.s-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:10px 12px}
.alert.bad{border-left-color:var(--bad)} .alert.ok{border-left-color:var(--ok)}
.alert b{display:block}
.alert span{font-size:14px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.act:hover{border-color:var(--accent)}
.act:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.act svg{width:38px;height:38px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.act b{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;line-height:1}
.act span{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;border-bottom:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:52px}
.ev .t{min-width:0}
.ev .t b{display:block}
.ev .t span{font-size:14px;color:var(--muted)}
.ex{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
/* folha de anotação */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet h3{font-family:var(--display);font-size:28px;text-transform:uppercase;margin:0 0 4px}
.field{margin-top:16px}
.field>label,.field>.lbl{display:block;font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:48px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:700}
input,select{font:inherit;font-size:20px;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:52px}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px}
.stepper button{font:inherit;font-size:26px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.stepper input{text-align:center;font-family:var(--display);font-size:30px;font-weight:700}
.row{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;font:inherit;font-weight:700;font-size:18px;padding:15px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:14px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700}
.report{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px}
.small{font-size:13px;color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.links button{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer}
@media (max-width:380px){.kpi .val{font-size:28px}.act b{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.instalar{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
textarea{font:inherit;font-size:14px;width:100%;min-height:110px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">Caderno do Vaqueiro<small>Fazendas Chapadão e Serro Azul · Altamira – PA</small></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="instalar" id="instalar" hidden>Instalar</button><span class="pill" id="net"><i class="dot"></i>Salvo no celular</span></div>
  </header>
  <div class="demo" id="banner">Base: caderno de 21/07/2026. As anotações ficam guardadas neste celular, mesmo sem sinal. <span id="exNote">Os registros marcados como <b>exemplo</b> são de demonstração: para usar de verdade, vá em Relatório → Começar do zero.</span></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="in">
    <button data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Início</button>
    <button data-tab="anotar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Anotar</button>
    <button data-tab="rebanho"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rebanho</button>
    <button data-tab="relatorio"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg>Relatório</button>
  </div>
</nav>

<div id="sheetRoot"></div>

<script>
/* ===== Base: caderno de 21/07/2026 ===== */
const BASE_DATE = "2026-07-21";
const BASE = [
  {k:"vacas", nome:"Vacas", q:684, ua:1},
  {k:"touros", nome:"Touros", q:6, ua:1.25},
  {k:"garrotes", nome:"Garrotes P.O.", q:9, ua:0.75},
  {k:"novilhas", nome:"Novilhas", q:209, ua:0.75},
  {k:"bzaF25", nome:"Bezerras K25", q:275, ua:0.5},
  {k:"bzoM25", nome:"Bezerros K25", q:107, ua:0.5},
  {k:"bzoM26", nome:"Bezerros K26", q:77, ua:0.25},
  {k:"bzaF26", nome:"Bezerras K26", q:89, ua:0.25},
];
const AREA_HA = 1200;
const VACAS_PRENHAS_EST = Math.round(684*0.89); // prenhez informada 88–90%
/* Régua de manejo de pastagens (Embrapa Gado de Corte, 2017) — altura do capim em cm */
const REGUA = {
  "Mombaça": {entrada:85, saida:45, modo:"rotacionado"},
  "Braquiária (Marandu)": {entrada:35, saida:20, modo:"continuo"},
};
const PIQUETES = ["Piquete 1","Piquete 2","Piquete 3","Piquete 4","Piquete 5","Piquete 6","Piquete 7","Piquete 8"];

const EXEMPLO = [
  {tipo:"nasc", data:"2026-08-14", qtd:21, sexo:"F"},
  {tipo:"nasc", data:"2026-08-14", qtd:19, sexo:"M"},
  {tipo:"pesa", data:"2026-08-01", lote:"Bezerras K25", qtd:40, peso:214},
  {tipo:"vac", data:"2026-09-03", produto:"Brucelose (B19)", lote:"Bezerras K26", qtd:60},
  {tipo:"venda", data:"2026-09-10", lote:"Bezerros K25", qtd:100, obs:"Vendidos para outro produtor"},
  {tipo:"nasc", data:"2026-09-18", qtd:28, sexo:"F"},
  {tipo:"nasc", data:"2026-09-18", qtd:27, sexo:"M"},
  {tipo:"morte", data:"2026-09-22", lote:"Bezerros K26", qtd:1, causa:"Diarreia"},
  {tipo:"doenca", data:"2026-09-25", lote:"Bezerros K26", qtd:2, causa:"Diarreia"},
  {tipo:"pasto", data:"2026-10-06", piquete:"Piquete 5", capim:"Mombaça", altura:90},
  {tipo:"nasc", data:"2026-10-12", qtd:20, sexo:"F"},
  {tipo:"nasc", data:"2026-10-12", qtd:18, sexo:"M"},
  {tipo:"doenca", data:"2026-10-15", lote:"Bezerras K26", qtd:3, causa:"Diarreia"},
  {tipo:"morte", data:"2026-10-17", lote:"Bezerras K26", qtd:1, causa:"Diarreia"},
  {tipo:"doenca", data:"2026-10-20", lote:"Bezerros K26", qtd:1, causa:"Diarreia"},
  {tipo:"morte", data:"2026-10-21", lote:"Bezerros K26", qtd:1, causa:"Outra"},
  {tipo:"pasto", data:"2026-10-24", piquete:"Piquete 7", capim:"Braquiária (Marandu)", altura:14},
  {tipo:"pasto", data:"2026-10-26", piquete:"Piquete 3", capim:"Mombaça", altura:60},
  {tipo:"pesa", data:"2026-10-28", lote:"Bezerras K25", qtd:40, peso:251},
].map((e,i)=>({id:"ex"+i, exemplo:true, ...e}));

/* ===== Armazenamento ===== */
const KEY="cadernoVaqueiro.v1";
let eventos = load();
function load(){ try{const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return EXEMPLO.slice(); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(eventos));}catch(e){} }

/* ===== Cálculos ===== */
const LOTE_KEY = {"Vacas":"vacas","Touros":"touros","Garrotes P.O.":"garrotes","Novilhas":"novilhas","Bezerras K25":"bzaF25","Bezerros K25":"bzoM25","Bezerros K26":"bzoM26","Bezerras K26":"bzaF26"};
const LOTES = Object.keys(LOTE_KEY);
const dias = (a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const hoje = ()=>new Date().toISOString().slice(0,10);
const fmt = n=>n.toLocaleString("pt-BR");
const dBR = s=>{const [y,m,d]=s.split("-");return d+"/"+m;};

function rebanho(){
  const r = Object.fromEntries(BASE.map(b=>[b.k,{...b, entra:0, sai:0}]));
  for(const e of eventos){
    if(e.data < BASE_DATE) continue;
    if(e.tipo==="nasc") r[e.sexo==="F"?"bzaF26":"bzoM26"].entra += e.qtd;
    if(e.tipo==="morte"||e.tipo==="venda"){ const k=LOTE_KEY[e.lote]; if(k) r[k].sai += e.qtd; }
  }
  return BASE.map(b=>{const x=r[b.k]; return {...x, atual:x.q+x.entra-x.sai};});
}
function indices(){
  const reb = rebanho();
  const total = reb.reduce((s,x)=>s+x.atual,0);
  const ua = reb.reduce((s,x)=>s+x.atual*x.ua,0);
  const nascBase = 77+89;
  const nascNovos = eventos.filter(e=>e.tipo==="nasc").reduce((s,e)=>s+e.qtd,0);
  const nascidos = nascBase + nascNovos;
  const mortesBz = eventos.filter(e=>e.tipo==="morte" && /K26/.test(e.lote)).reduce((s,e)=>s+e.qtd,0);
  const mort = nascidos? mortesBz/nascidos*100 : 0;
  // GMD: primeira e última pesagem de cada lote
  const gmds=[];
  for(const l of LOTES){
    const p = eventos.filter(e=>e.tipo==="pesa"&&e.lote===l).sort((a,b)=>a.data<b.data?-1:1);
    if(p.length>=2){const a=p[0],b=p[p.length-1],d=dias(a.data,b.data); if(d>0) gmds.push({lote:l,gmd:(b.peso-a.peso)/d,de:a,ate:b,d});}
  }
  const corte = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  const diarreia30 = eventos.filter(e=>e.tipo==="doenca"&&/diarr/i.test(e.causa||"")&&e.data>=corte).reduce((s,e)=>s+e.qtd,0);
  const diarreiaTot = eventos.filter(e=>(e.tipo==="doenca"||e.tipo==="morte")&&/diarr/i.test(e.causa||"")).reduce((s,e)=>s+e.qtd,0);
  const femeas26 = 89 + eventos.filter(e=>e.tipo==="nasc"&&e.sexo==="F").reduce((s,e)=>s+e.qtd,0)
                 - eventos.filter(e=>e.tipo==="morte"&&e.lote==="Bezerras K26").reduce((s,e)=>s+e.qtd,0);
  const vacBruc = eventos.filter(e=>e.tipo==="vac"&&/bruc/i.test(e.produto||"")).reduce((s,e)=>s+e.qtd,0);
  // pasto: última leitura por piquete
  const pasto={};
  for(const e of eventos.filter(e=>e.tipo==="pasto").sort((a,b)=>a.data<b.data?-1:1)) pasto[e.piquete]=e;
  return {reb,total,ua,uaha:ua/AREA_HA,cabha:total/AREA_HA,nascidos,mortesBz,mort,gmds,diarreia30,diarreiaTot,brucPend:Math.max(0,femeas26-vacBruc),femeas26,pasto};
}
function statusPasto(e){
  const r=REGUA[e.capim]; if(!r) return {cls:"warn",txt:"Sem régua",curto:"Sem régua"};
  if(e.altura < r.saida) return {cls:"bad",txt:r.modo==="continuo"?"Abaixo do mínimo: aliviar o pasto":"Abaixo do ponto de saída",curto:"Rebaixado"};
  if(r.modo==="continuo") return e.altura>r.entrada?{cls:"ok",txt:"Acima do máximo: cabe mais gado",curto:"Cabe mais gado"}:{cls:"warn",txt:"Na faixa certa",curto:"Na faixa"};
  if(e.altura >= r.entrada) return {cls:"ok",txt:"Pronto pra entrar o gado",curto:"Pronto"};
  return {cls:"warn",txt:"Em descanso / pastejo",curto:"Descanso"};
}

/* ===== Telas ===== */
const view = document.getElementById("view");
let tab="inicio";
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"page":"false"));
  ({inicio:telaInicio,anotar:telaAnotar,rebanho:telaRebanho,relatorio:telaRelatorio})[tab]();
  window.scrollTo(0,0);
}

function telaInicio(){
  const I=indices();
  const pctNasc = Math.min(100, I.nascidos/VACAS_PRENHAS_EST*100);
  const mortCls = I.mort<3?"s-ok":I.mort<5?"s-warn":"s-bad";
  const g = I.gmds[0];
  const gCls = g ? (g.gmd>=0.5?"s-ok":g.gmd>=0.35?"s-warn":"s-bad") : "";
  const alerts=[];
  for(const e of Object.values(I.pasto)){const s=statusPasto(e); if(s.cls!=="warn") alerts.push({cls:s.cls,t:`${e.piquete} (${e.capim.split(" ")[0]}): ${e.altura} cm`,s:s.cls==="bad"?`Tirar parte do gado. Mínimo da régua: ${REGUA[e.capim].saida} cm`:`Passou de ${REGUA[e.capim].entrada} cm na régua`});}
  if(I.brucPend>0) alerts.push({cls:"warn",t:`${I.brucPend} bezerras K26 sem vacina de brucelose`,s:"Vacinar entre 3 e 8 meses de idade (obrigatória)"});
  if(I.diarreia30>=3) alerts.push({cls:"bad",t:`${I.diarreia30} casos de diarreia nos últimos 30 dias`,s:"Avisar o veterinário e revisar piquete maternidade e cura de umbigo"});
  alerts.sort((a,b)=>(a.cls==="bad"?0:1)-(b.cls==="bad"?0:1));
  view.innerHTML = `
    <h2>Precisa de atenção</h2>
    <div class="alerts">${alerts.map(a=>`<div class="alert ${a.cls}"><div><b>${a.t}</b><span>${a.s}</span></div></div>`).join("")||`<div class="alert ok"><div><b>Tudo em dia</b></div></div>`}</div>
    <h2>Índices calculados</h2>
    <div class="grid">
      <div class="kpi wide"><div class="lab">Nascimentos na estação 2026</div>
        <div class="val">${fmt(I.nascidos)} <span class="sub">de ~${fmt(VACAS_PRENHAS_EST)} esperados</span></div>
        <div class="bar"><i style="width:${pctNasc.toFixed(0)}%"></i></div>
        <div class="sub" style="margin-top:6px">Esperados = 684 vacas × 89% de prenhez no ultrassom</div></div>
      <div class="kpi"><div class="lab">Mortalidade bezerros</div><div class="val">${I.mort.toFixed(1).replace(".",",")}%</div><div class="sub">${I.mortesBz} mortes · meta &lt; 3% <span class="state ${mortCls}">${I.mort<3?"ok":"atenção"}</span></div></div>
      <div class="kpi"><div class="lab">GMD recria</div><div class="val">${g?g.gmd.toFixed(2).replace(".",","):"—"} <span class="sub">kg/dia</span></div><div class="sub">${g?`${g.lote}, ${g.d} dias`:"Anote 2 pesagens"} ${g?`<span class="state ${gCls}">${g.gmd>=0.5?"bom":"abaixo"}</span>`:""}</div></div>
      <div class="kpi"><div class="lab">Lotação</div><div class="val">${I.uaha.toFixed(2).replace(".",",")} <span class="sub">UA/ha</span></div><div class="sub">${I.cabha.toFixed(2).replace(".",",")} cab/ha em ${fmt(AREA_HA)} ha</div></div>
      <div class="kpi"><div class="lab">Rebanho hoje</div><div class="val">${fmt(I.total)}</div><div class="sub">cabeças (caderno + anotações)</div></div>
    </div>
    <h2>Pastos (régua de manejo)</h2>
    <div class="tbl"><table><thead><tr><th>Piquete</th><th class="n">Altura</th><th>Situação</th></tr></thead><tbody>
      ${Object.values(I.pasto).sort((a,b)=>a.piquete<b.piquete?-1:1).map(e=>{const s=statusPasto(e);return `<tr><td>${e.piquete}<div class="small">${e.capim.split(" ")[0]}</div></td><td class="n">${e.altura} cm</td><td><span class="state s-${s.cls}">${s.curto}</span></td></tr>`}).join("")}
    </tbody></table></div>
    <p class="small">Régua Embrapa: Mombaça (rotacionado) entra com 85 cm e sai com 45 cm. Braquiária Marandu (contínuo) entre 20 e 35 cm.</p>`;
}

const ICONES = {
  nasc:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><path d="M20 12v16M12 20h16"/></svg>',
  pesa:'<svg viewBox="0 0 40 40"><rect x="6" y="14" width="28" height="20" rx="3"/><path d="M14 14a6 6 0 0 1 12 0"/><path d="M20 24l4-5"/></svg>',
  vac:'<svg viewBox="0 0 40 40"><path d="M27 6l7 7M30 9l-16 16-5 1 1-5L26 5"/><path d="M8 32l5-5"/></svg>',
  doenca:'<svg viewBox="0 0 40 40"><path d="M20 5l16 28H4z"/><path d="M20 16v8M20 28v1"/></svg>',
  morte:'<svg viewBox="0 0 40 40"><path d="M10 34h20M14 34V14a6 6 0 0 1 12 0v20"/><path d="M20 15v8M16 18h8"/></svg>',
  venda:'<svg viewBox="0 0 40 40"><path d="M6 12h22l6 8v8H6z"/><circle cx="12" cy="30" r="3"/><circle cx="28" cy="30" r="3"/></svg>',
  pasto:'<svg viewBox="0 0 40 40"><path d="M8 34c2-8 2-16 0-24M16 34c0-10 2-18 6-24M24 34c1-8 4-14 10-18"/><path d="M4 34h32"/></svg>',
};
const ACOES = [
  {t:"nasc",b:"Nasceu",s:"Bezerro ou bezerra"},
  {t:"pesa",b:"Pesagem",s:"Usar a balança do tronco"},
  {t:"pasto",b:"Pasto",s:"Altura do capim na régua"},
  {t:"doenca",b:"Doença",s:"Diarreia, tristeza, bicheira"},
  {t:"vac",b:"Vacina / remédio",s:"Brucelose, vermífugo"},
  {t:"morte",b:"Morte",s:"Anotar a causa"},
  {t:"venda",b:"Venda",s:"Bezerros, vacas de descarte"},
];
function telaAnotar(){
  view.innerHTML = `<h2>O que aconteceu?</h2><div class="actions">${ACOES.map(a=>`<button class="act" data-novo="${a.t}">${ICONES[a.t]}<b>${a.b}</b><span>${a.s}</span></button>`).join("")}</div>
  <h2>Últimas anotações</h2><div id="lista">${lista(eventos.slice().sort((a,b)=>a.data<b.data?1:-1).slice(0,8))}</div>`;
  view.querySelectorAll("[data-novo]").forEach(b=>b.onclick=()=>abrir(b.dataset.novo));
}
function descr(e){
  switch(e.tipo){
    case "nasc": return [`Nasceram ${e.qtd} ${e.sexo==="F"?"bezerras":"bezerros"}`, "Entram em K26"];
    case "pesa": return [`Pesagem: ${e.lote}`, `${e.qtd} animais · média ${e.peso} kg`];
    case "vac": return [`${e.produto}`, `${e.lote} · ${e.qtd} animais`];
    case "doenca": return [`${e.causa}: ${e.qtd} ${e.qtd>1?"casos":"caso"}`, e.lote];
    case "morte": return [`Morte: ${e.qtd} · ${e.causa}`, e.lote];
    case "venda": return [`Venda: ${e.qtd} animais`, e.lote+(e.obs?" · "+e.obs:"")];
    case "pasto": return [`${e.piquete}: ${e.altura} cm`, `${e.capim} · ${statusPasto(e).txt}`];
  }
}
function lista(arr){
  return arr.map(e=>{const [t,s]=descr(e);return `<div class="ev"><div class="d">${dBR(e.data)}</div><div class="t"><b>${t}${e.exemplo?'<span class="ex">exemplo</span>':""}</b><span>${s}</span></div></div>`}).join("")||`<p class="small">Nenhuma anotação ainda.</p>`;
}

function telaRebanho(){
  const I=indices();
  view.innerHTML = `<h2>Rebanho por categoria</h2>
  <div class="tbl"><table><thead><tr><th>Categoria</th><th class="n">Caderno 21/07</th><th class="n">Entrou</th><th class="n">Saiu</th><th class="n">Hoje</th></tr></thead><tbody>
  ${I.reb.map(x=>`<tr><td>${x.nome}</td><td class="n">${fmt(x.q)}</td><td class="n">${x.entra?"+"+x.entra:"—"}</td><td class="n">${x.sai?"−"+x.sai:"—"}</td><td class="n"><b>${fmt(x.atual)}</b></td></tr>`).join("")}
  <tr class="tot"><td>Total</td><td class="n">1.456</td><td></td><td></td><td class="n">${fmt(I.total)}</td></tr></tbody></table></div>
  <p class="small">Entradas vêm dos nascimentos anotados; saídas, das mortes e vendas. Tropa de serviço (11 animais) fora da conta.</p>
  <h2>Lotação estimada</h2>
  <div class="grid"><div class="kpi"><div class="lab">Unidades animais</div><div class="val">${fmt(Math.round(I.ua))} <span class="sub">UA</span></div><div class="sub">1 UA = 450 kg de peso vivo</div></div>
  <div class="kpi"><div class="lab">Por hectare</div><div class="val">${I.uaha.toFixed(2).replace(".",",")}</div><div class="sub">UA/ha em ${fmt(AREA_HA)} ha</div></div></div>
  <p class="small">Equivalências usadas: vaca 1,0 · touro 1,25 · novilha e garrote 0,75 · desmamado 0,5 · bezerro ao pé 0,25.</p>`;
}

function textoRelatorio(){
  const I=indices(); const g=I.gmds[0];
  return `📒 Caderno do Vaqueiro – ${new Date().toLocaleDateString("pt-BR")}
Fazendas Chapadão e Serro Azul

🐄 Rebanho: ${fmt(I.total)} cabeças
🍼 Nascimentos 2026: ${fmt(I.nascidos)} de ~${fmt(VACAS_PRENHAS_EST)} esperados
⚠️ Mortalidade de bezerros: ${I.mort.toFixed(1).replace(".",",")}% (${I.mortesBz} mortes)
⚖️ GMD ${g?g.lote+": "+g.gmd.toFixed(2).replace(".",",")+" kg/dia":"sem pesagens"}
💩 Diarreia: ${I.diarreia30} casos nos últimos 30 dias
💉 Bezerras sem brucelose: ${I.brucPend}
🌱 Pastos: ${Object.values(I.pasto).map(e=>`${e.piquete} ${e.altura} cm`).join(", ")}
📊 Lotação: ${I.uaha.toFixed(2).replace(".",",")} UA/ha`;
}
function telaRelatorio(){
  view.innerHTML = `<h2>Resumo para a produtora e o veterinário</h2>
  <div class="report" id="rel">${textoRelatorio()}</div>
  <div class="row"><button class="btn pri" id="copiar">Copiar para o WhatsApp</button></div>
  <p class="hint">Copie e cole no grupo da fazenda quando tiver sinal.</p>
  <h2>Todas as anotações</h2>${lista(eventos.slice().sort((a,b)=>a.data<b.data?1:-1))}
  <h2>Cópia de segurança</h2>
  <p class="small">As anotações ficam só neste celular. Uma vez por semana, copie o backup e mande no WhatsApp da fazenda. Se trocar de celular, cole aqui para recuperar.</p>
  <div class="row"><button class="btn" id="bkCopiar">Copiar backup</button></div>
  <div class="field"><label for="bkTexto">Restaurar backup</label><textarea id="bkTexto" placeholder="Cole aqui o backup copiado"></textarea></div>
  <div class="row"><button class="btn" id="bkRestaurar">Restaurar</button></div>
  <div class="links"><button id="reset">Voltar aos dados de exemplo</button><button id="limpar">Começar do zero</button></div>
  <div id="conf"></div>`;
  document.getElementById("copiar").onclick=()=>{
    const t=textoRelatorio();
    navigator.clipboard.writeText(t).then(()=>toast("Copiado")).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("rel"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado: copie manualmente");});
  };
  const conf=(msg,fn)=>{document.getElementById("conf").innerHTML=`<div class="alert bad" style="margin-top:12px"><div><b>${msg}</b><div class="row" style="margin-top:10px"><button class="btn" id="nao">Cancelar</button><button class="btn pri" id="sim">Confirmar</button></div></div></div>`;document.getElementById("nao").onclick=()=>document.getElementById("conf").innerHTML="";document.getElementById("sim").onclick=fn;};
  document.getElementById("bkCopiar").onclick=()=>{const t=JSON.stringify({app:"caderno-vaqueiro",v:1,data:hoje(),eventos});navigator.clipboard.writeText(t).then(()=>toast("Backup copiado")).catch(()=>{const a=document.getElementById("bkTexto");a.value=t;a.select();toast("Selecionado: copie manualmente");});};
  document.getElementById("bkRestaurar").onclick=()=>{try{const o=JSON.parse(document.getElementById("bkTexto").value);if(!o||!Array.isArray(o.eventos)) throw 0;conf(`Trocar as anotações atuais pelas do backup de ${o.data||"?"} (${o.eventos.length} registros)?`,()=>{eventos=o.eventos;save();render();toast("Backup restaurado");});}catch(e){toast("Backup inválido: cole o texto inteiro");}};
  document.getElementById("reset").onclick=()=>conf("Apagar suas anotações e voltar ao exemplo?",()=>{eventos=EXEMPLO.slice();save();render();toast("Exemplo restaurado");});
  document.getElementById("limpar").onclick=()=>conf("Apagar todas as anotações, inclusive o exemplo?",()=>{eventos=[];save();render();toast("Caderno limpo");});
}

/* ===== Folha de anotação ===== */
function chips(nome, opts, sel){return `<div class="chips" data-chips="${nome}">${opts.map(o=>`<button type="button" aria-pressed="${o===sel}" data-v="${o}">${o}</button>`).join("")}</div>`;}
function stepper(id,val){return `<div class="stepper"><button type="button" data-step="${id}" data-d="-1" aria-label="Menos">−</button><input id="${id}" type="number" inputmode="numeric" min="0" value="${val}"><button type="button" data-step="${id}" data-d="1" aria-label="Mais">+</button></div>`;}
function abrir(tipo){
  const a=ACOES.find(x=>x.t===tipo);
  let campos="";
  if(tipo==="nasc") campos=`<div class="field"><span class="lbl">Sexo</span>${chips("sexo",["Bezerra","Bezerro"],"Bezerra")}</div><div class="field"><label for="qtd">Quantos?</label>${stepper("qtd",1)}</div><p class="hint">Lembrete: cura do umbigo com Umbicura e conferir se mamou o colostro.</p>`;
  if(tipo==="pesa") campos=`<div class="field"><span class="lbl">Lote</span>${chips("lote",LOTES.slice(3),"Bezerras K25")}</div><div class="field"><label for="qtd">Quantos animais pesados?</label>${stepper("qtd",10)}</div><div class="field"><label for="peso">Peso médio (kg)</label><input id="peso" type="number" inputmode="numeric" value="240"></div>`;
  if(tipo==="vac") campos=`<div class="field"><span class="lbl">Produto</span>${chips("produto",["Brucelose (B19)","Clostridiose","Vermífugo","Carrapaticida","Outro"],"Brucelose (B19)")}</div><div class="field"><span class="lbl">Lote</span>${chips("lote",LOTES,"Bezerras K26")}</div><div class="field"><label for="qtd">Quantos animais?</label>${stepper("qtd",10)}</div>`;
  if(tipo==="doenca") campos=`<div class="field"><span class="lbl">O que é?</span>${chips("causa",["Diarreia","Tristeza parasitária","Bicheira","Pneumonia","Outra"],"Diarreia")}</div><div class="field"><span class="lbl">Lote</span>${chips("lote",LOTES,"Bezerros K26")}</div><div class="field"><label for="qtd">Quantos casos?</label>${stepper("qtd",1)}</div>`;
  if(tipo==="morte") campos=`<div class="field"><span class="lbl">Causa</span>${chips("causa",["Diarreia","Tristeza parasitária","Picada de cobra","Parto","Outra"],"Diarreia")}</div><div class="field"><span class="lbl">Lote</span>${chips("lote",LOTES,"Bezerros K26")}</div><div class="field"><label for="qtd">Quantos?</label>${stepper("qtd",1)}</div>`;
  if(tipo==="venda") campos=`<div class="field"><span class="lbl">Lote</span>${chips("lote",LOTES,"Bezerros K25")}</div><div class="field"><label for="qtd">Quantos?</label>${stepper("qtd",10)}</div>`;
  if(tipo==="pasto") campos=`<div class="field"><label for="piquete">Piquete</label><select id="piquete">${PIQUETES.map(p=>`<option>${p}</option>`).join("")}</select></div><div class="field"><span class="lbl">Capim</span>${chips("capim",Object.keys(REGUA),"Mombaça")}</div><div class="field"><label for="altura">Altura na régua (cm)</label>${stepper("altura",50)}</div><p class="hint" id="pastoHint"></p>`;
  document.getElementById("sheetRoot").innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${a.b}"><div class="panel">
    <h3>${a.b}</h3><div class="field"><label for="data">Data</label><input id="data" type="date" value="${hoje()}"></div>${campos}
    <div class="row"><button class="btn" id="cancel">Cancelar</button><button class="btn pri" id="ok">Salvar</button></div></div></div>`;
  const root=document.getElementById("sheetRoot");
  root.querySelectorAll("[data-chips]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");hintPasto();}));
  root.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.step);i.value=Math.max(0,(+i.value||0)+ +b.dataset.d*(b.dataset.step==="altura"?5:1));hintPasto();});
  const alt=document.getElementById("altura"); if(alt) alt.oninput=hintPasto;
  function sel(n){const b=root.querySelector(`[data-chips="${n}"] [aria-pressed="true"]`);return b?b.dataset.v:null;}
  function hintPasto(){const h=document.getElementById("pastoHint"); if(!h) return; const e={capim:sel("capim"),altura:+document.getElementById("altura").value}; const r=REGUA[e.capim]; h.textContent=r.modo==="continuo"?`${statusPasto(e).txt}. Manter entre ${r.saida} e ${r.entrada} cm.`:`${statusPasto(e).txt}. Entrada ${r.entrada} cm, saída ${r.saida} cm.`;}
  hintPasto();
  root.querySelector(".sheet").onclick=ev=>{if(ev.target.classList.contains("sheet")) fechar();};
  document.getElementById("cancel").onclick=fechar;
  document.getElementById("ok").onclick=()=>{
    const e={id:"u"+Date.now(),tipo,data:document.getElementById("data").value||hoje()};
    const q=document.getElementById("qtd"); if(q) e.qtd=Math.max(1,+q.value||1);
    if(tipo==="nasc") e.sexo=sel("sexo")==="Bezerra"?"F":"M";
    if(sel("lote")) e.lote=sel("lote");
    if(sel("produto")) e.produto=sel("produto");
    if(sel("causa")) e.causa=sel("causa");
    if(tipo==="pesa") e.peso=+document.getElementById("peso").value||0;
    if(tipo==="pasto"){e.piquete=document.getElementById("piquete").value;e.capim=sel("capim");e.altura=+document.getElementById("altura").value||0;}
    eventos.push(e); save(); fechar(); render(); toast("Anotado");
  };
}
function fechar(){document.getElementById("sheetRoot").innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape") fechar();});

let tT; function toast(m){let t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(tT); tT=setTimeout(()=>t.hidden=true,1800);}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
function net(){const p=document.getElementById("net"); const on=navigator.onLine; p.innerHTML=`<i class="dot" style="background:${on?"var(--ok)":"var(--warn)"}"></i>${on?"Salvo no celular":"Sem sinal · salvando no celular"}`;}
addEventListener("online",net); addEventListener("offline",net); net();
const _render=render; render=function(){_render(); const n=document.getElementById("exNote"); if(n) n.hidden=!eventos.some(e=>e.exemplo);};
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
let promptInstalar=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();promptInstalar=e;document.getElementById("instalar").hidden=false;});
document.getElementById("instalar").onclick=async()=>{if(!promptInstalar) return; promptInstalar.prompt(); await promptInstalar.userChoice; promptInstalar=null; document.getElementById("instalar").hidden=true;};
addEventListener("appinstalled",()=>toast("App instalado"));
</script>
